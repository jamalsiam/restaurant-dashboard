<mat-toolbar
  class="app-navbar"
  [class.scrolled]="isScrolled()"
  role="banner"
>
  <div class="nav-inner">
    <!-- Interactive Brand Logo & Title (Navigates to Dashboard) -->
    <a
      routerLink="/dashboard"
      (click)="closeMobileMenu()"
      class="nav-brand"
      aria-label="RestoData Enterprise Home"
    >
      <div class="brand-logo" aria-hidden="true">
        <mat-icon>restaurant</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-title">RestoData Enterprise</span>
        <span class="brand-sub">Multi-Branch Management</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links desktop-only" aria-label="Main Navigation">
      <a
        mat-button
        routerLink="/dashboard"
        routerLinkActive="active-nav-item"
        class="nav-mat-link nav-link"
      >
        <mat-icon class="link-icon">dashboard</mat-icon>
        <span>Executive Overview</span>
      </a>
      <a
        mat-button
        routerLink="/menu"
        routerLinkActive="active-nav-item"
        class="nav-mat-link nav-link"
      >
        <mat-icon class="link-icon">menu_book</mat-icon>
        <span>Menu Data Explorer</span>
      </a>
    </nav>

    <!-- Right Actions: Theme Toggle & Mobile Hamburger -->
    <div class="nav-actions">
      <!-- Clean Icon-Only Light / Dark Mode Switcher -->
      <button
        type="button"
        mat-icon-button
        class="theme-toggle-btn"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [matTooltip]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      >
        @if (themeService.isDark()) {
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        }
      </button>

      <!-- Mobile Hamburger Toggle Button -->
      <button
        type="button"
        mat-icon-button
        class="mobile-menu-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer" role="dialog" aria-label="Mobile Navigation">
      <nav class="mobile-nav-list">
        <a
          mat-button
          routerLink="/dashboard"
          routerLinkActive="mobile-active-item"
          (click)="closeMobileMenu()"
          class="mobile-nav-item"
        >
          <mat-icon>dashboard</mat-icon>
          <span>Executive Overview</span>
        </a>
        <a
          mat-button
          routerLink="/menu"
          routerLinkActive="mobile-active-item"
          (click)="closeMobileMenu()"
          class="mobile-nav-item"
        >
          <mat-icon>menu_book</mat-icon>
          <span>Menu Data Explorer</span>
        </a>
      </nav>
    </div>

    <!-- Backdrop Overlay for Mobile Drawer -->
    <div class="mobile-backdrop" (click)="closeMobileMenu()" aria-hidden="true"></div>
  }
</mat-toolbar>
